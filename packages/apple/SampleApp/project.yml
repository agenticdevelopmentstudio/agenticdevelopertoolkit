name: AgenticDeveloperToolkitSampleApp
options:
  bundleIdPrefix: com.mikefullerton.AgenticDeveloperToolkit
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "Agentic Developer Toolkit"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

projectReferences:
  AgenticDeveloperToolkit:
    path: ../AgenticDeveloperToolkit/AgenticDeveloperToolkit.xcodeproj

targets:
  AgenticDeveloperToolkitSampleApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.macos
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

  AgenticDeveloperToolkitSampleApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: AgenticDeveloperToolkit/AgenticDeveloperToolkitUI-iOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperToolkit/AgenticDeveloperToolkit-iOS
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  AgenticDeveloperToolkitSampleApp-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.watchos
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES

  AgenticDeveloperToolkitSampleApp-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.tvos

  AgenticDeveloperToolkitSampleApp-visionOS:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperToolkit.visionos
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  AgenticDeveloperToolkitSampleApp-macOS:
    build:
      targets:
        AgenticDeveloperToolkitSampleApp-macOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AgenticDeveloperToolkitSampleApp-iOS:
    build:
      targets:
        AgenticDeveloperToolkitSampleApp-iOS: all
    run:
      config: Debug
  AgenticDeveloperToolkitSampleApp-watchOS:
    build:
      targets:
        AgenticDeveloperToolkitSampleApp-watchOS: all
    run:
      config: Debug
  AgenticDeveloperToolkitSampleApp-tvOS:
    build:
      targets:
        AgenticDeveloperToolkitSampleApp-tvOS: all
    run:
      config: Debug
  AgenticDeveloperToolkitSampleApp-visionOS:
    build:
      targets:
        AgenticDeveloperToolkitSampleApp-visionOS: all
    run:
      config: Debug
